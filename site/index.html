<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexi</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 650;
    }

    p {
      margin: 0;
      color: color-mix(in srgb, CanvasText 68%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Lexi</h1>
    <p>Placeholder page for Vercel.</p>
  </main>
</body>
</html>
